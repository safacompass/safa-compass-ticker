<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safa Compass 24 — Live Broadcast Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-deep: #000b30;
      --navy-mid: #05164d;
      --navy-light: #0b226b;
      --gold-primary: #d4af37;
      --gold-bright: #f3d98b;
      --gold-dark: #9c7b1c;
      --text-white: #f8fafc;
      --text-muted: #cbd5e1;
      --up-green: #34d399;
      --warn-yellow: #fbbf24;
      --down-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent; /* Transparent for OneStream Live overlay */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================
       MIDDLE RIGHT SIDEBAR BOX (Travel Advisories)
       Positioned over the middle white box on the right
       ========================================== */
    .sidebar-box {
      position: absolute;
      top: 388px; /* Perfectly aligned with the middle right box slot */
      left: 1472px; /* Fits inside the 400px right sidebar width */
      width: 412px;
      height: 310px;
      background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .sidebar-header {
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold-dark);
    }

    .advisory-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .advisory-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 34, 107, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 8px 12px;
    }

    .advisory-country {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-white);
    }

    .advisory-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-level {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .level-1 {
      background: rgba(52, 211, 153, 0.2);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.5);
    }

    .level-2 {
      background: rgba(251, 191, 36, 0.2);
      color: var(--warn-yellow);
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    .level-3 {
      background: rgba(248, 113, 113, 0.2);
      color: var(--down-red);
      border: 1px solid rgba(248, 113, 113, 0.5);
    }

    /* ==========================================
       BOTTOM TICKER DOCK
       ========================================== */
    .ticker-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1920px;
      height: 176px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px 16px 24px;
      background: linear-gradient(180deg, rgba(0, 11, 48, 0.96) 0%, #000b30 100%);
      border-top: 2px solid var(--gold-primary);
    }

    .ticker-row {
      display: flex;
      align-items: center;
      height: 68px;
      width: 100%;
      background: linear-gradient(90deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .ticker-badge {
      flex-shrink: 0;
      height: 100%;
      min-width: 220px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-gold {
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 55%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      border-right: 2px solid var(--gold-bright);
    }

    .badge-navy {
      background: linear-gradient(135deg, var(--navy-light) 0%, var(--navy-deep) 100%);
      color: var(--gold-bright);
      border-right: 2px solid var(--gold-primary);
    }

    .ticker-viewport {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 45s linear infinite;
    }

    .ticker-row.slow .ticker-track {
      animation-duration: 55s;
    }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
    }

    .item-label {
      color: var(--gold-bright);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .item-value {
      color: var(--text-white);
      font-weight: 700;
    }

    .item-meta {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .status-pill {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .status-on-time {
      background: rgba(52, 211, 153, 0.15);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .status-delayed {
      background: rgba(248, 113, 113, 0.15);
      color: var(--down-red);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .divider {
      color: var(--gold-primary);
      font-size: 16px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- MIDDLE RIGHT SIDEBAR: TRAVEL ADVISORIES -->
  <div class="sidebar-box">
    <div class="sidebar-header">
      <span>Travel Advisories</span>
      <span style="font-size: 12px; color: var(--navy-deep); opacity: 0.8;">LIVE</span>
    </div>
    <div class="advisory-list" id="advisory-container">
      <!-- Injected dynamically via JS -->
    </div>
  </div>

  <!-- BOTTOM TICKER DOCK -->
  <div class="ticker-dock">
    <!-- TICKER 1: FX RATES -->
    <div class="ticker-row">
      <div class="ticker-badge badge-gold">FX RATES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="fx-track"></div>
      </div>
    </div>

    <!-- TICKER 2: FLIGHT WATCH -->
    <div class="ticker-row slow">
      <div class="ticker-badge badge-navy">FLIGHT WATCH</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="flight-track"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. Travel Advisories Data (Edit directly here whenever statuses change)
    const travelAdvisories = [
      { country: "Saudi Arabia", level: "Level 2", badgeClass: "level-2", note: "Exercise Caution" },
      { country: "Türkiye", level: "Level 2", badgeClass: "level-2", note: "Border Vigilance" },
      { country: "UAE", level: "Level 1", badgeClass: "level-1", note: "Normal Precautions" },
      { country: "Malaysia", level: "Level 1", badgeClass: "level-1", note: "Standard Safety" },
      { country: "Egypt", level: "Level 2", badgeClass: "level-2", note: "Reconsider Border Areas" },
      { country: "Jordan", level: "Level 2", badgeClass: "level-2", note: "Exercise Caution" }
    ];

    function renderAdvisories() {
      const container = document.getElementById("advisory-container");
      container.innerHTML = travelAdvisories.map(item => `
        <div class="advisory-card">
          <div>
            <div class="advisory-country">${item.country}</div>
            <div class="advisory-desc">${item.note}</div>
          </div>
          <div class="badge-level ${item.badgeClass}">${item.level}</div>
        </div>
      `).join("");
    }

    // 2. Ticker Data & Rendering
    const sampleFX = [
      { pair: "USD / SAR", rate: "3.7504", note: "SAUDI RIYAL" },
      { pair: "GBP / SAR", rate: "4.7820", note: "BRITISH POUND" },
      { pair: "EUR / SAR", rate: "4.0615", note: "EURO" },
      { pair: "CAD / SAR", rate: "2.7190", note: "CANADIAN DOLLAR" },
      { pair: "AUD / SAR", rate: "2.4650", note: "AUSTRALIAN DOLLAR" },
      { pair: "MYR / SAR", rate: "0.8410", note: "MALAYSIAN RINGGIT" }
    ];

    const sampleFlights = [
      { flight: "SV 020", route: "JFK → JED", time: "14:35", status: "ON TIME", ok: true },
      { flight: "SV 112", route: "LHR → JED", time: "15:10", status: "LANDED", ok: true },
      { flight: "QR 1184", route: "DOH → MED", time: "16:05", status: "ON TIME", ok: true },
      { flight: "EK 803", route: "DXB → JED", time: "16:45", status: "DELAYED", ok: false },
      { flight: "TK 096", route: "IST → MED", time: "17:20", status: "BOARDING", ok: true }
    ];

    function renderFXTicker(items) {
      const track = document.getElementById("fx-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.pair}</span>
          <span class="item-value">${item.rate}</span>
          <span class="item-meta">(${item.note})</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    function renderFlightTicker(items) {
      const track = document.getElementById("flight-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.flight}</span>
          <span class="item-value">${item.route}</span>
          <span class="item-meta">${item.time}</span>
          <span class="status-pill ${item.ok ? 'status-on-time' : 'status-delayed'}">${item.status}</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    // Initialize all components
    renderAdvisories();
    renderFXTicker(sampleFX);
    renderFlightTicker(sampleFlights);
  </script>
</body>
</html>
