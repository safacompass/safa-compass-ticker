<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safa Compass 24 — Live Broadcast Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-deep: #000b30;
      --navy-mid: #05164d;
      --navy-light: #0b226b;
      --gold-primary: #d4af37;
      --gold-bright: #f3d98b;
      --gold-dark: #9c7b1c;
      --text-white: #f8fafc;
      --text-muted: #cbd5e1;
      --up-green: #34d399;
      --warn-yellow: #fbbf24;
      --down-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================
       MIDDLE RIGHT SIDEBAR BOX (Travel Advisories)
       Exact fit for the middle white cutout (1580, 464, 328x230)
       ========================================== */
    .sidebar-box {
      position: absolute;
      top: 464px;
      left: 1580px;
      width: 328px;
      height: 230px;
      background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .sidebar-header {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold-dark);
      z-index: 2;
    }

    .live-pill {
      background: var(--navy-deep);
      color: var(--gold-bright);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
    }

    /* Continuous Vertical Scroll Viewport */
    .advisory-viewport {
      flex: 1;
      overflow: hidden;
      position: relative;
      padding: 0 10px;
      mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    }

    .advisory-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
      /* Adjust 110s if you want faster or slower vertical scrolling */
      animation: scroll-up 110s linear infinite;
    }

    @keyframes scroll-up {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    .origin-group {
      padding-top: 10px;
      padding-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .origin-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(212, 175, 55, 0.16);
      border-left: 3px solid var(--gold-primary);
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      padding: 4px 8px;
      border-radius: 0 4px 4px 0;
    }

    .origin-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-bright);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .origin-agency {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .advisory-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 34, 107, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.22);
      border-radius: 5px;
      padding: 4px 8px;
    }

    .advisory-country {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.2;
    }

    .advisory-desc {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-level {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .level-1 {
      background: rgba(52, 211, 153, 0.2);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.5);
    }

    .level-2 {
      background: rgba(251, 191, 36, 0.2);
      color: var(--warn-yellow);
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    .level-3 {
      background: rgba(248, 113, 113, 0.2);
      color: var(--down-red);
      border: 1px solid rgba(248, 113, 113, 0.5);
    }

    /* ==========================================
       BOTTOM TICKER DOCK
       ========================================== */
    .ticker-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1920px;
      height: 176px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px 16px 24px;
      background: linear-gradient(180deg, rgba(0, 11, 48, 0.96) 0%, #000b30 100%);
      border-top: 2px solid var(--gold-primary);
    }

    .ticker-row {
      display: flex;
      align-items: center;
      height: 68px;
      width: 100%;
      background: linear-gradient(90deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .ticker-badge {
      flex-shrink: 0;
      height: 100%;
      min-width: 235px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-gold {
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 55%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      border-right: 2px solid var(--gold-bright);
    }

    .badge-navy {
      background: linear-gradient(135deg, var(--navy-light) 0%, var(--navy-deep) 100%);
      color: var(--gold-bright);
      border-right: 2px solid var(--gold-primary);
    }

    .ticker-viewport {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 55s linear infinite;
    }

    .ticker-row.slow .ticker-track {
      animation-duration: 75s;
    }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
    }

    .item-label {
      color: var(--gold-bright);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .item-value {
      color: var(--text-white);
      font-weight: 700;
    }

    .item-meta {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .fare-pill {
      padding: 3px 12px;
      border-radius: 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: rgba(52, 211, 153, 0.16);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.45);
    }

    .fare-pill.deal {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-bright);
      border: 1px solid rgba(212, 175, 55, 0.55);
    }

    .divider {
      color: var(--gold-primary);
      font-size: 16px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- MIDDLE RIGHT SIDEBAR: CONTINUOUS VERTICAL SCROLL OF ALL AUDIENCE ADVISORIES -->
  <div class="sidebar-box">
    <div class="sidebar-header">
      <span>Travel Advisories</span>
      <span class="live-pill">BY ORIGIN</span>
    </div>
    <div class="advisory-viewport">
      <div class="advisory-track" id="advisory-track"></div>
    </div>
  </div>

  <!-- BOTTOM TICKER DOCK -->
  <div class="ticker-dock">
    <!-- TICKER 1: FX RATES -->
    <div class="ticker-row">
      <div class="ticker-badge badge-gold">FX RATES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="fx-track"></div>

    </div>

    <!-- TICKER 2: FLIGHT PRICES -->
    <div class="ticker-row slow">
      <div class="ticker-badge badge-navy">FLIGHT FARES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="flight-track"></div>
      </div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "YOUR_PUBLISHED_GOOGLE_SHEET_CSV_URL_HERE";

    // 1. All Advisories Grouped Separately by Target Audience Country

        ]
      },
      {

        items: [
          { country: "Saudi Arabia", level: "High Caution", badgeClass: "level-2", note: "Regional Awareness" },

          { country: "Jordan", level: "High Caution", badgeClass: "level-2", note: "Regional Vigilance" }

          { country: "Saudi Arabia", level: "Level 2", badgeClass: "level-2", note: "High Degree of Caution" },
          { country: "Türkiye", level: "Level 2", badgeClass: "level-2", note: "High Degree of Caution" },
          { country: "UAE", level: "Level 2", badgeClass: "level-2", note: "High Degree of Caution" },
          { country: "Malaysia", level: "Level 1", badgeClass: "level-1", note: "Normal Safety Precautions" },

        sourceTag: "GOV CANADA",
        items: [
          { country: "Saudi Arabia", level: "High Caution", badgeClass: "level-2", note: "Exercise High Caution" },
          { country: "Türkiye", level: "High Caution", badgeClass: "level-2", note: "Exercise High Caution" },
          { country: "UAE", level: "High Caution", badgeClass: "level-2", note: "Regional Security" },
          { country: "Malaysia", level: "Normal", badgeClass: "level-1", note: "Normal Security Precautions" },
          { country: "Egypt", level: "High Caution", badgeClass: "level-2", note: "Avoid Non-Essential Border" },

        ]

      {

        sourceTag: "SAFETRAVEL NZ",
        items: [
          { country: "Saudi Arabia", level: "Level 2", badgeClass: "level-2", note: "Exercise Increased Caution" },
          { country: "Türkiye", level: "Level 2", badgeClass: "level-2", note: "Exercise Increased Caution" },
          { country: "UAE", level: "Level 2", badgeClass: "level-2", note: "Exercise Increased Caution" },
          { country: "Malaysia", level: "Level 1", badgeClass: "level-1", note: "Exercise Normal Caution" },

        ]
      },
      {

        sourceTag: "DIRCO SA",
        items: [
          { country: "Saudi Arabia", level: "Standard", badgeClass: "level-1", note: "Hajj/Umrah Visa Rules" },
          { country: "Türkiye", level: "Caution", badgeClass: "level-2", note: "Regional Border Awareness" },
          { country: "UAE", level: "Standard", badgeClass: "level-1", note: "Normal Precautions" },
          { country: "Malaysia", level: "Standard", badgeClass: "level-1", note: "Visa-Free Entry Rules" },
          { country: "Egypt", level: "Caution", badgeClass: "level-2", note: "Sinai & Border Vigilance" },
          { country: "Jordan", level: "Caution", badgeClass: "level-2", note: "Regional Vigilance" }
        ]
      },
      {
        originTitle: "FROM SINGAPORE",
        sourceTag: "MFA SINGAPORE",
        items: [
          { country: "Saudi Arabia", level: "Vigilance", badgeClass: "level-2", note: "e-Register & Regional Alert" },
          { country: "Türkiye", level: "Vigilance", badgeClass: "level-2", note: "Avoid Border Areas" },
          { country: "UAE", level: "Normal", badgeClass: "level-1", note: "Normal Precautions" },
          { country: "Malaysia", level: "Normal", badgeClass: "level-1", note: "Standard Cross-Border" },
          { country: "Egypt", level: "Caution", badgeClass: "level-2", note: "Defer Non-Essential Sinai" },
          { country: "Jordan", level: "Vigilance", badgeClass: "level-2", note: "Regional Awareness" }
        ]
      },
      {
        originTitle: "FROM EU",
        sourceTag: "EU CONSULAR",
        items: [
          { country: "Saudi Arabia", level: "Caution", badgeClass: "level-2", note: "Regional Security Alert" },
          { country: "Türkiye", level: "Caution", badgeClass: "level-2", note: "Border Zone Restrictions" },
          { country: "UAE", level: "Normal", badgeClass: "level-1", note: "Normal Precautions" },
          { country: "Malaysia", level: "Normal", badgeClass: "level-1", note: "Normal Precautions" },
          { country: "Egypt", level: "High Caution", badgeClass: "level-2", note: "Border & Sinai Advisories" },
          { country: "Jordan", level: "Caution", badgeClass: "level-2", note: "Regional Vigilance" }
        ]
      }
    ];

    function renderScrollingAdvisories() {
      const track = document.getElementById("advisory-track");
      const html = audienceAdvisories.map(group => `
        <div class="origin-group">
          <div class="origin-banner">
            <span class="origin-name">${group.originTitle}</span>
            <span class="origin-agency">${group.sourceTag}</span>
          </div>
          ${group.items.map(item => `
            <div class="advisory-card">
              <div>
                <div class="advisory-country">${item.country}</div>
                <div class="advisory-desc">${item.note}</div>
              </div>
              <div class="badge-level ${item.badgeClass}">${item.level}</div>
            </div>
          `).join("")}
        </div>
      `).join("");

      // Duplicate once for seamless infinite vertical scroll
      track.innerHTML = html + html;
    }

    // 2. Currency Exchange Rates
    const sampleFX = [
      { pair: "USD / SAR", rate: "3.7504", note: "US DOLLAR" },
      { pair: "EUR / SAR", rate: "4.0615", note: "EURO (IRELAND / EU)" },
      { pair: "GBP / SAR", rate: "4.7820", note: "BRITISH POUND" },
      { pair: "AUD / SAR", rate: "2.4650", note: "AUSTRALIAN DOLLAR" },
      { pair: "CAD / SAR", rate: "2.7190", note: "CANADIAN DOLLAR" },
      { pair: "NZD / SAR", rate: "2.2410", note: "NEW ZEALAND DOLLAR" },
      { pair: "ZAR / SAR", rate: "0.2115", note: "SOUTH AFRICAN RAND" },
      { pair: "SGD / SAR", rate: "2.7980", note: "SINGAPORE DOLLAR" }
    ];

    // 3. Flight Prices (Core Audience Hubs -> Target Destinations)
    const sampleFlightFares = [
      { route: "NEW YORK (JFK) → JEDDAH", price: "$685", trip: "ROUND-TRIP", deal: true },
      { route: "DUBLIN (DUB) → JEDDAH", price: "€445", trip: "ROUND-TRIP", deal: true },
      { route: "LONDON (LHR) → JEDDAH", price: "£410", trip: "ROUND-TRIP", deal: true },
      { route: "TORONTO (YYZ) → ISTANBUL", price: "CAD $840", trip: "ROUND-TRIP", deal: false },
      { route: "SYDNEY (SYD) → KUALA LUMPUR", price: "AUD $590", trip: "ROUND-TRIP", deal: true },
      { route: "AUCKLAND (AKL) → KUALA LUMPUR", price: "NZD $745", trip: "ROUND-TRIP", deal: true },
      { route: "JOHANNESBURG (JNB) → JEDDAH", price: "ZAR 9,850", trip: "ROUND-TRIP", deal: true },
      { route: "SINGAPORE (SIN) → JEDDAH", price: "SGD $680", trip: "ROUND-TRIP", deal: true },
      { route: "FRANKFURT (FRA) → ISTANBUL", price: "€215", trip: "ROUND-TRIP", deal: true }
    ];

    function renderFXTicker(items) {
      const track = document.getElementById("fx-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.pair}</span>
          <span class="item-value">${item.rate}</span>
          <span class="item-meta">(${item.note})</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    function renderFlightTicker(items) {
      const track = document.getElementById("flight-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.route}</span>
          <span class="fare-pill ${item.deal ? 'deal' : ''}">${item.price}</span>
          <span class="item-meta">${item.trip}</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    async function fetchGoogleSheetData() {
      if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("YOUR_PUBLISHED")) {
        renderFXTicker(sampleFX);
        renderFlightTicker(sampleFlightFares);
        return;
      }

      try {
        const res = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`);
        const csvText = await res.text();
        console.log("Fetched live CSV:", csvText);
      } catch (err) {
        console.error("Sheet fetch error:", err);
      }
    }

    // Initialize everything
    renderScrollingAdvisories();
    fetchGoogleSheetData();
    setInterval(fetchGoogleSheetData, 60000);
  </script>
</body>
</html>
