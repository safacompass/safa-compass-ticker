<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safa Compass 24 — Live Broadcast Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-deep: #000b30;
      --navy-mid: #05164d;
      --navy-light: #0b226b;
      --gold-primary: #d4af37;
      --gold-bright: #f3d98b;
      --gold-dark: #9c7b1c;
      --text-white: #f8fafc;
      --text-muted: #cbd5e1;
      --up-green: #34d399;
      --warn-yellow: #fbbf24;
      --down-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================
       MIDDLE RIGHT SIDEBAR BOX (Travel Advisories)
       Exact fit for the middle white cutout (1580, 464, 328x230)
       ========================================== */
    .sidebar-box {
      position: absolute;
      top: 464px;
      left: 1580px;
      width: 328px;
      height: 230px;
      background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .sidebar-header {
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 60%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--gold-dark);
    }

    .advisory-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Hide scrollbar for clean broadcast appearance */
    .advisory-list::-webkit-scrollbar {
      display: none;
    }
    .advisory-list {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .advisory-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 34, 107, 0.45);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 5px;
      padding: 5px 8px;
    }

    .advisory-country {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.2;
    }

    .advisory-desc {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-level {
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .level-1 {
      background: rgba(52, 211, 153, 0.2);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.5);
    }

    .level-2 {
      background: rgba(251, 191, 36, 0.2);
      color: var(--warn-yellow);
      border: 1px solid rgba(251, 191, 36, 0.5);
    }

    .level-3 {
      background: rgba(248, 113, 113, 0.2);
      color: var(--down-red);
      border: 1px solid rgba(248, 113, 113, 0.5);
    }

    /* ==========================================
       BOTTOM TICKER DOCK
       ========================================== */
    .ticker-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1920px;
      height: 176px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px 16px 24px;
      background: linear-gradient(180deg, rgba(0, 11, 48, 0.96) 0%, #000b30 100%);
      border-top: 2px solid var(--gold-primary);
    }

    .ticker-row {
      display: flex;
      align-items: center;
      height: 68px;
      width: 100%;
      background: linear-gradient(90deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    .ticker-badge {
      flex-shrink: 0;
      height: 100%;
      min-width: 235px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-gold {
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-primary) 55%, var(--gold-dark) 100%);
      color: var(--navy-deep);
      border-right: 2px solid var(--gold-bright);
    }

    .badge-navy {
      background: linear-gradient(135deg, var(--navy-light) 0%, var(--navy-deep) 100%);
      color: var(--gold-bright);
      border-right: 2px solid var(--gold-primary);
    }

    .ticker-viewport {
      position: relative;
      flex: 1;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 2%, #000 98%, transparent 100%);
    }

    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 45s linear infinite;
    }

    .ticker-row.slow .ticker-track {
      animation-duration: 60s;
    }

    @keyframes scroll-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
    }

    .item-label {
      color: var(--gold-bright);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .item-value {
      color: var(--text-white);
      font-weight: 700;
    }

    .item-meta {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .fare-pill {
      padding: 3px 12px;
      border-radius: 4px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: rgba(52, 211, 153, 0.16);
      color: var(--up-green);
      border: 1px solid rgba(52, 211, 153, 0.45);
    }

    .fare-pill.deal {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-bright);
      border: 1px solid rgba(212, 175, 55, 0.55);
    }

    .divider {
      color: var(--gold-primary);
      font-size: 16px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <!-- MIDDLE RIGHT SIDEBAR: TRAVEL ADVISORIES -->
  <div class="sidebar-box">
    <div class="sidebar-header">
      <span>Travel Advisories</span>
      <span style="font-size: 11px; color: var(--navy-deep); opacity: 0.85;">LIVE</span>
    </div>
    <div class="advisory-list" id="advisory-container"></div>
  </div>

  <!-- BOTTOM TICKER DOCK -->
  <div class="ticker-dock">
    <!-- TICKER 1: FX RATES -->
    <div class="ticker-row">
      <div class="ticker-badge badge-gold">FX RATES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="fx-track"></div>
      </div>
    </div>

    <!-- TICKER 2: FLIGHT PRICES -->
    <div class="ticker-row slow">
      <div class="ticker-badge badge-navy">FLIGHT FARES</div>
      <div class="ticker-viewport">
        <div class="ticker-track" id="flight-track"></div>
      </div>
    </div>
  </div>

  <script>
    // Replace with your published Google Sheet CSV URL to pull live rates & fares
    const SHEET_CSV_URL = "YOUR_PUBLISHED_GOOGLE_SHEET_CSV_URL_HERE";

    // 1. Travel Advisories Data
    const travelAdvisories = [
      { country: "Saudi Arabia", level: "Level 2", badgeClass: "level-2", note: "Exercise Caution" },
      { country: "Türkiye", level: "Level 2", badgeClass: "level-2", note: "Border Vigilance" },
      { country: "UAE", level: "Level 1", badgeClass: "level-1", note: "Normal Precautions" },
      { country: "Malaysia", level: "Level 1", badgeClass: "level-1", note: "Standard Safety" },
      { country: "Egypt", level: "Level 2", badgeClass: "level-2", note: "Reconsider Border Areas" },
      { country: "Jordan", level: "Level 2", badgeClass: "level-2", note: "Exercise Caution" }
    ];

    function renderAdvisories() {
      const container = document.getElementById("advisory-container");
      container.innerHTML = travelAdvisories.map(item => `
        <div class="advisory-card">
          <div>
            <div class="advisory-country">${item.country}</div>
            <div class="advisory-desc">${item.note}</div>
          </div>
          <div class="badge-level ${item.badgeClass}">${item.level}</div>
        </div>
      `).join("");
    }

    // 2. Currency Exchange Rates
    const sampleFX = [
      { pair: "USD / SAR", rate: "3.7504", note: "SAUDI RIYAL" },
      { pair: "GBP / SAR", rate: "4.7820", note: "BRITISH POUND" },
      { pair: "EUR / SAR", rate: "4.0615", note: "EURO" },
      { pair: "CAD / SAR", rate: "2.7190", note: "CANADIAN DOLLAR" },
      { pair: "AUD / SAR", rate: "2.4650", note: "AUSTRALIAN DOLLAR" },
      { pair: "MYR / SAR", rate: "0.8410", note: "MALAYSIAN RINGGIT" }
    ];

    // 3. Flight Prices (Core Audience Hubs -> Target Destinations)
    const sampleFlightFares = [
      { route: "NEW YORK (JFK) → JEDDAH", price: "$685", trip: "ROUND-TRIP", deal: true },
      { route: "LONDON (LHR) → JEDDAH", price: "£410", trip: "ROUND-TRIP", deal: true },
      { route: "TORONTO (YYZ) → ISTANBUL", price: "CAD $840", trip: "ROUND-TRIP", deal: false },
      { route: "NEW YORK (JFK) → DUBAI", price: "$720", trip: "ROUND-TRIP", deal: false },
      { route: "LONDON (LHR) → KUALA LUMPUR", price: "£560", trip: "ROUND-TRIP", deal: true },
      { route: "SYDNEY (SYD) → KUALA LUMPUR", price: "AUD $590", trip: "ROUND-TRIP", deal: true },
      { route: "CHICAGO (ORD) → AMMAN", price: "$795", trip: "ROUND-TRIP", deal: false },
      { route: "LONDON (LHR) → CAIRO", price: "£325", trip: "ROUND-TRIP", deal: true }
    ];

    function renderFXTicker(items) {
      const track = document.getElementById("fx-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.pair}</span>
          <span class="item-value">${item.rate}</span>
          <span class="item-meta">(${item.note})</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    function renderFlightTicker(items) {
      const track = document.getElementById("flight-track");
      const html = items.map(item => `
        <div class="ticker-item">
          <span class="item-label">${item.route}</span>
          <span class="fare-pill ${item.deal ? 'deal' : ''}">${item.price}</span>
          <span class="item-meta">${item.trip}</span>
        </div>
        <span class="divider">◆</span>
      `).join("");
      track.innerHTML = html + html;
    }

    async function fetchGoogleSheetData() {
      if (!SHEET_CSV_URL || SHEET_CSV_URL.includes("YOUR_PUBLISHED")) {
        renderFXTicker(sampleFX);
        renderFlightTicker(sampleFlightFares);
        return;
      }

      try {
        const res = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`);
        const csvText = await res.text();
        // Parse CSV rows from your Google Sheet into renderFXTicker() & renderFlightTicker()
        console.log("Fetched live CSV:", csvText);
      } catch (err) {
        console.error("Sheet fetch error:", err);
      }
    }

    // Auto-scroll the Travel Advisories list smoothly so all 6 countries are visible on 24/7 stream
    function startAdvisoryAutoScroll() {
      const list = document.getElementById("advisory-container");
      let direction = 1;
      setInterval(() => {
        if (!list) return;
        list.scrollTop += direction;
        if (list.scrollTop + list.clientHeight >= list.scrollHeight - 1) {
          direction = -1;
        } else if (list.scrollTop <= 0) {
          direction = 1;
        }
      }, 50);
    }

    renderAdvisories();
    fetchGoogleSheetData();
    startAdvisoryAutoScroll();
    setInterval(fetchGoogleSheetData, 60000);
  </script>
</body>
</html>
