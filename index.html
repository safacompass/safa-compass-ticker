<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safa Compass Ticker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
    }
    .ticker-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }
    .bar {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
    }
    .rates-bar {
      background: rgba(15, 23, 42, 0.95);
      border-top: 3px solid #0284c7;
      color: #ffffff;
    }
    .flights-bar {
      background: rgba(15, 23, 42, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .scroll-text {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 35s linear infinite;
      font-size: 16px;
      font-weight: bold;
    }
    .flights-text {
      animation-duration: 45s;
    }
    .item { margin-right: 35px; }
    .badge { color: #38bdf8; text-transform: uppercase; }
    .badge-flight { color: #f59e0b; text-transform: uppercase; }
    .price { color: #4ade80; }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <div class="ticker-container">
    <div class="bar rates-bar">
      <div class="scroll-text" id="rates">
        <span class="item"><span class="badge">💱 LIVE RATES (1 USD):</span></span>
        <span class="item">🇪🇺 0.92 EUR</span>
        <span class="item">🇿🇦 18.10 ZAR</span>
        <span class="item">🇳🇿 1.65 NZD</span>
        <span class="item">🇲🇾 4.45 MYR</span>
        <span class="item">🇸🇬 1.34 SGD</span>
        <span class="item">🇦🇪 3.67 AED</span>
        <span class="item">🇸🇦 3.75 SAR</span>
        <span class="item">🇹🇷 34.20 TRY</span>
      </div>
    </div>
    <div class="bar flights-bar">
      <div class="scroll-text flights-text" id="flights">
        <span class="item"><span class="badge-flight">✈️ FLIGHT DEALS:</span></span>
        <span class="item">LHR ➔ KUL: <span class="price">$485</span> <i>(Hijrah Hub)</i></span>
        <span class="item">DUB ➔ IST: <span class="price">$240</span> <i>(Türkiye Expat)</i></span>
        <span class="item">JFK ➔ JED: <span class="price">$620</span> <i>(Umrah / Saudi)</i></span>
        <span class="item">AKL ➔ KUL: <span class="price">$540</span> <i>(Nomad)</i></span>
        <span class="item">JNB ➔ DOH: <span class="price">$410</span> <i>(Qatar Living)</i></span>
      </div>
    </div>
  </div>

  <script>
    fetch('https://open.er-api.com/v6/latest/USD')
      .then(res => res.json())
      .then(data => {
        const r = data.rates;
        if (r) {
          document.getElementById('rates').innerHTML = `
            <span class="item"><span class="badge">💱 LIVE RATES (1 USD):</span></span>
            <span class="item">🇪🇺 ${r.EUR ? r.EUR.toFixed(2) : '0.92'} EUR</span>
            <span class="item">🇿🇦 ${r.ZAR ? r.ZAR.toFixed(2) : '18.10'} ZAR</span>
            <span class="item">🇳🇿 ${r.NZD ? r.NZD.toFixed(2) : '1.65'} NZD</span>
            <span class="item">🇲🇾 ${r.MYR ? r.MYR.toFixed(2) : '4.45'} MYR</span>
            <span class="item">🇸🇬 ${r.SGD ? r.SGD.toFixed(2) : '1.34'} SGD</span>
            <span class="item">🇦🇪 ${r.AED ? r.AED.toFixed(2) : '3.67'} AED</span>
            <span class="item">🇸🇦 ${r.SAR ? r.SAR.toFixed(2) : '3.75'} SAR</span>
            <span class="item">🇹🇷 ${r.TRY ? r.TRY.toFixed(2) : '34.20'} TRY</span>
          `;
        }
      })
      .catch(err => console.log('Using static fallback values'));
  </script>
</body>
</html>
